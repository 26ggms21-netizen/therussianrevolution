.clock{display:inline-block;font-size:12px;font-weight:700;letter-spacing:0;background:var(--brass-bg);color:#6F4E10;border-radius:20px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.tb{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}.tb th,.tb td{border:1px solid var(--line);padding:8px 10px;text-align:left}.tb th{background:var(--paper)}
.fig{margin:0;display:grid;gap:6px;min-width:0}
.zoom{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;cursor:zoom-in}
.zoom img{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--soft)}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:center}
.narrow{max-width:420px;justify-self:center;width:100%}
.act{border:1.5px solid var(--steel);border-radius:14px;padding:14px 16px;display:grid;gap:9px;background:var(--steel-bg)}
.act h3{font-size:18px}.act .tag{font-size:12px;font-weight:700;color:var(--steel)}
.act details{background:#fff;border-style:solid;border-color:#C3D3DF}
#lb{position:fixed;inset:0;z-index:20;background:#14100CE6;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out;border:0;width:100%}
#lb img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('l41-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('l41-'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('l41-'+k)}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const foot=(t,c='poppy')=>`<p class="foot c-${c}">${t}</p>`;
const tile=(t,b,c='')=>`<div class="tile ${c?'t-'+c:''}"><h3>${t}</h3><p>${b}</p></div>`;
const src=n=>(window.IMAGES&&window.IMAGES[n])||`img/${n}.webp`;
const fig=(n,cap,alt)=>`<figure class="fig"><button class="zoom" data-zoom="${src(n)}" aria-label="${alt} 크게 보기"><img src="${src(n)}" alt="${alt}"></button>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;
const act=(t,q,a)=>`<div class="act"><div class="tag">${t}</div><h3>${q}</h3><details><summary>답 확인하기</summary><p>${a}</p></details></div>`;
const timer=m=>`<span class="clock">⏱ ${m}분</span>`;
const ROUTES=[['design','수업 설계','교사용'],['charta','학습 교재','CHARTA'],['fontes','사료 세 장','FONTES'],['via','혁명 열차 방탈출','VIA'],['relatio','확산 보고서(개인 활동)','RELATIO'],['concilium','광장 회의(모둠 활동)','CONCILIUM'],['teacher','교사용','TEACHER']];
const article=rows=>`<div class="rows">${rows.map(r=>`<div class="step"><b>${r[0]}</b><p>${r[1]}</p></div>`).join('')}</div>`;

/* ---------- 공용 장면 ---------- */
const S={};
S.metaphora=`<h2>트럭 시위에서 시작된<br><span class="hl">팬덤 혁명</span></h2>
<div class="bubble">소속사 대표가 모든 걸 혼자 정한다. 무리한 해외 투어로 멤버들도 팬들도 지쳤다. 참다못한 팬들이 회사 앞에 트럭 시위를 연다. “우리에게 쉬는 시간과 공정한 운영을!”</div>
<div class="rows"><div class="row meta-row"><div>팬덤 혁명</div><div>러시아 혁명과 소련</div></div>
${[['대표 혼자 모든 걸 정하는 소속사','차르의 전제 정치'],['무리한 투어로 모두가 지쳤다','러일 전쟁, 제1차 세계 대전'],['트럭 시위로 대표를 물러나게 한다','3월 혁명, 차르 퇴위'],['임시 운영진이 들어섰지만 투어를 계속한다','임시 정부'],['“투어 중단, 굿즈는 모두에게!” 강경파 팬 연합이 운영권을 잡는다','레닌과 볼셰비키의 11월 혁명'],['여러 팬클럽을 하나의 연합 팬덤으로 묶는다','소련 수립(1922)'],['해외 팬덤에 운영 방식을 알려 주고 지원한다','코민테른, 사회주의의 확산'],['새 리더가 반대하는 회원을 강퇴하고, 모두에게 스밍 할당량을 정한다','스탈린의 숙청, 5개년 계획과 집단화']].map(r=>`<div class="row"><div>${r[0]}</div><div>${r[1]}</div></div>`).join('')}</div>
<p>비유에는 한계도 있다. 실제 혁명에는 내전과 기근, 숙청으로 수많은 사람의 목숨이 걸려 있었다. 비유는 권력이 어떻게 바뀌고 퍼졌는지 이해하는 데까지만 쓴다.</p>
${foot('“모두에게 공평하게”라는 약속, 마지막에는 누구에게 지켜졌을까?','brass')}`;

const words=list=>`<div class="words"><div class="words-h">📖 낱말 풀이</div><dl>${list.map(w=>`<div><dt>${w[0]}</dt><dd>${w[1]}${w[2]?`<small>예) ${w[2]}</small>`:''}</dd></div>`).join('')}</dl></div>`;
const easy=t=>`<div class="easy"><b>한 줄로 말하면</b> ${t}</div>`;

S.s1=`<h2>빵이 모자란 나라,<br>황제만 강한 나라</h2>
${easy('황제 혼자 모든 걸 정하는데, 전쟁 때문에 먹고살기가 너무 힘들어졌다. 그래서 사람들이 거리로 나왔다.')}
<div class="g2">
${tile('사람들이 달라졌다','19세기 말 러시아에도 공장이 많이 생겼다. 공장에서 일하는 노동자가 늘었고, 책을 읽는 사람들 사이에서 “모두가 평등하게 나눠 가지자”는 사회주의 생각이 퍼졌다.','steel')}
${tile('황제는 그대로였다','러시아의 황제 ‘차르’는 의회 없이 혼자 나라를 다스렸다. 여기에 일본과 벌인 러일 전쟁까지 겹쳐 빵값이 오르고 생활이 어려워졌다. 사람들은 대규모 시위로 맞섰다.','poppy')}
</div>
${words([['차르','러시아 황제를 부르는 이름.'],['전제 정치','왕이나 황제 한 사람이 법과 의회 없이 모든 것을 결정하는 정치.','반장이 회의도 없이 학급 규칙을 혼자 다 정하는 것'],['노동자','공장 등에서 일하고 그 대가로 임금을 받는 사람.'],['사회주의','공장이나 땅을 몇몇 부자가 아니라 모두가 함께 갖고 똑같이 나누자는 생각.','급식을 먼저 온 사람이 다 가져가지 않고 모두에게 같은 양을 나누는 것']])}
<div class="source"><div class="lab">더 알아보기 · 피의 일요일 사건(1905)</div><p>노동자들이 황제에게 “살기 힘드니 도와 달라”며 평화롭게 행진했다. 그런데 군대가 총을 쏴 많은 사람이 죽거나 다쳤다. 황제는 의회(두마)를 만들겠다고 약속했지만 달라진 것은 거의 없었다. 사람들은 이때부터 황제를 믿지 않게 되었다.</p></div>
${act('생각 열기','레닌의 연설을 듣는 민중이 원한 세상은 어떤 세상이었을까?','전쟁이 없는 평화로운 세상, 모든 농민이 자기 땅을 가진 세상, 모두가 평등하게 나누는 세상을 원했을 것이다.')}
${foot('비유로 보면, 대표 혼자 모든 걸 정하고 무리한 투어로 모두가 지쳐 있었다.','steel')}`;

S.s2=`<h2>한 해에 두 번,<br>1917년의 혁명</h2>
${easy('1917년 3월에는 황제를 쫓아냈고, 11월에는 레닌이 이끄는 무리가 새 정부까지 무너뜨리고 권력을 잡았다.')}
<div class="g3">
${fig('crowd','① 1917. 3. 거리로 나간 민중. “빵과 평화, 토지와 자유!”를 외쳤다.','깃발을 들고 거리를 행진하는 러시아 민중의 사진')}
${fig('provgov','② 1917. 3. 새로 생긴 임시 정부. 그런데 전쟁을 멈추지 않았다.','탁자에 둘러앉은 임시 정부 인사들의 사진')}
${fig('lenin','③ 1917. 11. 연설하는 레닌. “전쟁을 당장 멈추자!”고 외쳤다.','연단에서 군중에게 연설하는 레닌의 사진')}
</div>
<div class="g2">
<div class="tile t-steel"><h3>3월 혁명: 황제를 쫓아내다</h3><p><b>왜?</b> 제1차 세계 대전에서 계속 지고, 사람들은 죽고 굶주렸다.<br><b>어떻게?</b> 노동자와 군인이 “전쟁 그만, 황제는 물러나라!”를 외치며 들고일어났다.<br><b>그 결과</b> 대표 모임(소비에트)을 만들어 황제를 쫓아내고, 임시 정부를 세웠다.</p></div>
<div class="tile t-poppy"><h3>11월 혁명: 레닌이 권력을 잡다</h3><p><b>왜?</b> 임시 정부도 전쟁을 계속했고, 약속한 개혁을 미뤘다.<br><b>어떻게?</b> 레닌이 이끄는 볼셰비키가 무기를 들고 일어났다.<br><b>그 결과</b> 임시 정부를 무너뜨리고 소비에트 정부를 세웠다.</p></div>
</div>
${words([['소비에트','‘평의회’, 곧 ‘대표들의 모임’이라는 뜻. 노동자와 병사들이 뽑은 대표들이 모였다.','반마다 뽑힌 대표들이 모인 학생 대표 회의'],['임시 정부','정식 정부가 생기기 전까지 잠깐 나라를 맡은 정부.','담임 선생님이 출장 갔을 때 잠시 반을 맡는 선생님'],['볼셰비키','러시아어로 ‘다수파’. 레닌이 이끈 무리로, 나중에 이름을 ‘공산당’으로 바꿨다.'],['무장봉기','무기를 들고 일어나 정부와 싸우는 것.'],['휴전','싸움을 잠시 멈추는 것.']])}
<div class="side"><div class="source"><div class="lab">「전 러시아 소비에트 대회 선언문」(1917. 11.)</div><blockquote>소비에트 정권은 지금 즉시 민주적인 평화와 모든 전선에서의 <b>휴전</b>이 이뤄져야 함을 국민에게 제의할 것이다. 소비에트 정권은 토지를 무상으로 농민 위원회에 넘기고, …… 생산을 노동자가 통제하는 제도를 만들고, …… 러시아에 사는 모든 민족에게 진정한 자결권을 보장할 것이다.</blockquote><p class="note"><b>쉽게 풀면</b> ① 전쟁을 당장 멈추겠다. ② 땅은 돈 받지 않고 농민에게 주겠다. ③ 공장은 노동자가 운영하게 하겠다. ④ 러시아 안의 여러 민족이 스스로 앞날을 정하게 하겠다.</p></div>
<div class="narrow" style="max-width:300px">${fig('poster','소비에트 정부의 선전 포스터(1920). 레닌이 빗자루로 황제, 귀족, 부자를 지구 밖으로 쓸어 내고 있다.','지구 위에서 빗자루로 왕과 귀족, 자본가를 쓸어내는 레닌을 그린 포스터')}</div></div>
${act('탐구 ①','밑줄 친 ‘휴전’은 어떤 전쟁을 멈추자는 것일까?','제1차 세계 대전')}
${act('탐구 ②','11월 혁명을 일으킨 사람들은 어떤 세상을 만들고 싶었을까? 선언문의 네 가지 약속을 보고 답해 보자.','전쟁이 멈춰 평화가 오고, 지주의 땅이 돈 없이 농민에게 넘어가며, 모든 민족이 스스로 앞날을 정하는 세상을 만들고 싶었을 것이다.')}
<p class="note"><b>이름이 두 개인 까닭</b> 교과서 1은 ‘2월 혁명·10월 혁명’, 교과서 2는 ‘3월 혁명·11월 혁명’이라고 쓴다. 같은 사건이다. 당시 러시아가 쓰던 달력은 오늘날 달력보다 13일 늦어서 달 이름이 달라졌다.</p>
${foot('비유로 보면, 트럭 시위로 대표를 몰아냈지만 임시 운영진도 투어를 멈추지 않자 강경파 팬 연합이 운영권을 잡았다.')}`;

S.s3=`<h2>하나로 묶인 나라,<br>한 사람에게 모인 권력</h2>
${easy('레닌은 전쟁을 끝내고 여러 나라를 묶어 소련을 만들었다. 다음 지도자 스탈린은 나라를 빨리 키웠지만, 그 과정에서 농민과 반대하는 사람들이 큰 고통을 겪었다.')}
<div class="chain">
<div class="step"><b>레닌</b><div><h3>전쟁을 멈추고, 땅과 공장을 나라 것으로</h3><p>독일과 조약을 맺어 전쟁에서 빠졌다. 땅과 큰 공장, 은행을 나라가 갖게 했다. 혁명에 반대한 세력이 다른 나라의 도움을 받아 싸우면서 나라 안에서 전쟁(내전)이 벌어졌지만, 정부가 이겼다.</p></div></div>
<div class="step"><b>1922</b><div><h3>소련이 생기다</h3><p>러시아 주변에 생긴 여러 소비에트 정부를 하나로 묶어 ‘소비에트 사회주의 공화국 연방’, 줄여서 <b>소련</b>을 세웠다.</p></div></div>
<div class="step"><b>스탈린</b><div><h3>빠른 성장, 무서운 독재</h3><p>레닌 다음 지도자 스탈린은 ‘5개년 계획’을 세워 철강, 기계 같은 무거운 산업을 키우고 농민들의 땅을 모아 함께 농사짓게 했다. 소련은 빠르게 공업 국가가 되었다.</p></div></div>
</div>
<div class="side">${fig('farm','집단 농장에서 함께 밥을 먹는 소련 농민들(1938)','넓은 들판에서 둘러앉아 식사하는 집단 농장 농민들의 사진')}
<div class="tile t-poppy"><h3>빠른 성장의 그늘</h3><p>정부는 농민이 거둔 곡식을 강제로 가져갔고, 큰 굶주림(대기근)이 일어났다. 스탈린은 자기에게 반대하는 사람들을 대대적으로 없앴고(숙청), 이 과정에서 많은 사람이 목숨을 잃었다.</p></div></div>
${words([['국유화','땅이나 공장을 개인이 아니라 나라가 갖게 하는 것.'],['내전','한 나라 안에서 국민끼리 편을 나누어 벌이는 전쟁.'],['연방','여러 나라가 하나의 큰 나라로 묶인 것.','미국도 여러 주가 묶인 연방이다'],['5개년 계획','5년 동안 무엇을 얼마나 만들지 나라가 정해 두고 밀어붙이는 계획.'],['중공업','철강, 기계, 배처럼 크고 무거운 물건을 만드는 산업.'],['집단화','농민들의 땅을 하나로 모아 다 같이 농사짓게 하고, 거둔 곡식은 나라가 가져가는 것.'],['숙청','반대하는 사람들을 감옥에 보내거나 없애 버리는 것.'],['독재','한 사람이나 한 무리가 모든 권력을 쥐고 마음대로 다스리는 것.']])}
<div class="source"><div class="lab">더 알아보기 · 신경제 정책(NEP)</div><p>내전으로 경제가 어려워지자 레닌은 잠시 한발 물러섰다. 농민이 세금을 낸 뒤 남은 곡식은 시장에 팔 수 있게 하고, 작은 가게나 공장은 개인이 운영하게 했다. 스탈린은 이 정책을 버리고 모든 것을 나라가 정하는 방식으로 돌아갔다.</p></div>
${foot('비유로 보면, 여러 팬클럽을 하나로 묶은 뒤 새 리더가 반대하는 회원을 강퇴하고 모두에게 할당량을 정했다.','steel')}`;

S.s4=`<h2>모스크바에서<br>서울까지 퍼진 생각</h2>
${easy('레닌은 “식민지 사람들도 함께 싸우자”며 세계 곳곳을 도왔다. 그래서 독립을 바라던 식민지 사람들이 사회주의에 관심을 가졌다.')}
${fig('spread','사회주의의 확산. 러시아 혁명 뒤 세계 곳곳에 공산당이 생겼다. 1925년 한국에도 조선 공산당이 생겼다. 누르면 크게 볼 수 있다.','러시아 혁명 이후 각국의 혁명과 공산당 결성 연도를 표시한 세계 지도')}
<div class="g2">
<div class="tile t-steel"><h3>코민테른: 세계를 잇는 모임</h3><p>레닌은 혁명을 다른 나라로 퍼뜨리려고 여러 나라 공산당을 묶은 ‘코민테른’을 만들었다. 코민테른은 다른 나라의 노동자 운동과 식민지의 독립운동을 도왔다. 한국의 독립운동도 지원했다.</p></div>
<div class="tile t-brass"><h3>왜 식민지 사람들이 귀 기울였나</h3><p>레닌은 “유럽 강대국은 식민지를 빼앗아 부자가 되었다”고 비판했다. 1920년에는 구호도 바뀌었다. “전 세계 노동자여, 뭉쳐라!”에서 <b>“전 세계 노동자와 억눌린 민족이여, 뭉쳐라!”</b>로. 식민지 사람들은 이 말에서 희망을 보았다.</p></div>
</div>
${words([['코민테른','‘공산주의 인터내셔널’의 줄임말. 여러 나라 공산당이 모인 국제 조직.'],['식민지','다른 나라에 주권을 빼앗겨 지배받는 곳.','일제 강점기의 우리나라'],['반제국주의','강한 나라가 약한 나라를 빼앗고 지배하는 것에 반대하는 생각.'],['민족 운동','식민지 사람들이 독립하려고 벌인 운동.']])}
<div class="side">${fig('donga','레닌에 대한 글이 실린 『동아일보』 기사(1921. 8. 30.)','‘니콜라이 레닌은 어떤 사람인가’라는 제목이 실린 동아일보 지면')}
<div class="tile"><h3>우리나라 신문에 실린 레닌</h3><p>1921년 『동아일보』에 「니콜라이 레닌은 어떤 사람인가」라는 글이 두 달쯤 이어서 실렸다. 그만큼 우리나라 사람들도 사회주의를 궁금해했다. 코민테른이 세운 학교에는 아시아에서 온 학생이 많았다.</p></div></div>
<div class="scroll"><table class="tb"><thead><tr><th>이름</th><th>출신</th><th>한 일</th></tr></thead><tbody>
<tr><td>박헌영</td><td>한국</td><td>독립운동가, 사회주의 운동을 이끌었다</td></tr>
<tr><td>호찌민</td><td>베트남</td><td>베트남의 독립운동 조직을 만들었다</td></tr>
<tr><td>덩샤오핑</td><td>중국</td><td>일본에 맞서 싸우고 대장정에 참여했다</td></tr></tbody></table></div>
<p class="note">코민테른이 세운 학교에서 공부한 인물들. 수업 PPT 탐구 활동의 답이다.</p>
${foot('비유로 보면, 한 팬덤의 운영 방식이 해외 팬덤으로 퍼져 나갔다.','olive')}`;

S.legacy=`<h2>달력, 지도, 그리고<br>‘소비에트’라는 말</h2>
<div class="g2">
${tile('달력','같은 혁명을 ‘3월 혁명’이라고도, ‘2월 혁명’이라고도 부른다. 러시아는 혁명 뒤에 오늘날과 같은 달력으로 바꾸었다.','brass')}
${tile('지도','소련은 1991년에 무너져 러시아, 우크라이나 등 15개 나라로 나뉘었다.','steel')}
${tile('우리 역사','1925년 조선 공산당이 생겼다. 사회주의는 독립운동의 한 갈래가 되었다.','olive')}
${tile('교과서의 주어','교과서에는 레닌, 볼셰비키, 스탈린의 이름이 나온다. 그런데 땅을 일구던 농민이나 숙청된 사람들의 이름은 보이지 않는다.','poppy')}
</div>
<p>같은 혁명도 누가 이야기하느냐에 따라 달라진다. 소비에트 정부에게는 ‘해방’, 식민지 청년에게는 ‘희망’, 집단 농장 농민에게는 ‘빼앗김과 굶주림’이었다. 누구의 눈으로 본 이야기인지 따져 보는 것이 관점 학습의 첫걸음이다.</p>
${foot('100년 전 혁명의 흔적은 오늘의 달력, 지도, 말에 남아 있다.','brass')}`;

S.tabula=`<h2>빵을 달라는 외침에서<br>세계로 퍼진 생각까지</h2>
<div class="arrows"><div class="arrow a2">황제와 전쟁</div><div class="arrow a1">두 번의 혁명</div><div class="arrow a4">소련의 탄생</div><div class="arrow a3">세계로 퍼짐</div></div>
<div class="rows"><div class="row meta-row"><div>구분</div><div>핵심 내용</div></div>
<div class="row"><div>왜 일어났나</div><div>노동자가 늘고 사회주의가 퍼짐 + 황제 혼자 다스림 + 전쟁으로 먹고살기 힘듦</div></div>
<div class="row"><div>3월 혁명</div><div>노동자·군인이 들고일어남 → 대표 모임(소비에트) → 황제 쫓아냄 → 임시 정부</div></div>
<div class="row"><div>11월 혁명</div><div>레닌과 볼셰비키가 무기를 들고 일어남 → 소비에트 정부</div></div>
<div class="row"><div>소련</div><div>전쟁 중단, 땅·공장을 나라 것으로, 내전 → 소련(1922) → 스탈린: 5개년 계획, 집단화, 숙청</div></div>
<div class="row"><div>세계에 준 영향</div><div>코민테른 → 여러 나라에 공산당, 식민지 독립운동 성장</div></div></div>
${act('마무리','레닌이 이끈 볼셰비키는 임시 정부를 무너뜨리고 (    ) 정부를 세웠다.','소비에트')}
${act('마무리','사회주의가 세계 여러 곳으로 퍼진 까닭은 무엇일까?','레닌은 유럽 강대국이 식민지를 빼앗아 힘을 키운다고 비판했고, 코민테른은 약한 민족의 독립 투쟁을 도왔다. 그래서 독립을 바라던 세계 곳곳의 지식인들이 사회주의를 받아들였다.')}
<p class="center">오늘 배운 내용을 네 장면, 한 줄로.</p>`;

{n:'③',t:'『동아일보』 「니콜라이 레닌은 어떤 사람인가」',d:'1921년 · 교과서 2 p.197',img:'donga',body:'<p>레닌을 소개한 글이 두 달쯤 이어서 실렸다. 일본의 지배를 받던 우리나라 신문이 멀리 러시아의 혁명가를 소개한 것이다.</p>',who:'식민지 조선의 신문사',when:'3·1 운동 2년 뒤',why:'새로운 생각을 궁금해하는 독자들에게 알려 주려고',ask:'식민지 조선 사람들은 레닌의 어떤 점이 궁금했을까? 소련이 식민지를 도운 데에는 소련의 이익도 있었을까?'}];
S.fontes=`<h2>황제에게 쓴 청원서,<br>빗자루 포스터, 식민지 신문</h2>
<p>사료는 내용보다 먼저 <b>누가, 언제, 왜 만들었는가</b>를 묻는다. 그래야 같은 혁명을 다룬 세 기록이 왜 서로 다르게 보이는지 알 수 있다.</p>

${foot('세 기록을 겹쳐 읽어야 보이는 것: 같은 혁명, 다른 입장','olive')}`;

<div class="g2"><div class="tile t-steel"><h3>평등의 약속과 확산</h3><p><b>사실적 질문</b><br>혁명은 어떻게 일어나 소련이 되었나<br>→ 방탈출 · 자물쇠 8개 · 5분</p><p><b>개념적 질문</b><br>사회주의는 왜 세계로 퍼졌나<br>→ 확산 보고서 · 2칸 · 4분</p></div>

${foot('읽기는 교재로, 활동은 15분 안에','brass')}`,

 ${matrix}
 <h3>${T.cls?clsName(T.cls):'전체 반'} · ${T.grp?'모둠 '+T.grp:'전체 모둠'} · ${shown.length}건</h3>
 <div class="board">${shown.length?shown.map(x=>recordCard(x,`<span class="when">${latest[x.cls+'|'+x.grp]===x?'<i class="new">최신</i>':'<i class="old">이전 제출</i>'} ${esc(fmtTime(x.at))}</span>`)).join(''):'<p class="note">아직 표시할 제출물이 없다. 학생이 제출한 뒤 게시물 확인을 다시 누르면 나타난다.</p>'}</div></section>`}
function bindTeacher(){
 $('#tform').onsubmit=async e=>{e.preventDefault();T.err='';
  if(!SYNC_URL){T.items=store.get('subs',[]);render();return}
  T.key=$('#tkey').value;if(!T.key){T.err='교사 암호를 입력하세요.';render();return}
  T.loading=true;render();
  try{const a=await post({action:'list',key:T.key});
   if(a&&a.ok){T.items=a.items}else{T.items=null;T.err=a&&a.error==='wrong_key'?'암호가 맞지 않습니다. 다시 입력하세요.':a&&a.error==='key_not_set'?'apps-script.gs의 KEY를 교사 암호로 바꾼 뒤 새 버전으로 배포하세요.':'게시물을 불러오지 못했습니다. 잠시 뒤 다시 시도하세요.'}
  }catch(x){T.err='서버에 연결하지 못했습니다. 인터넷 연결과 SYNC_URL, 웹 앱의 액세스 권한(모든 사용자)을 확인하세요.'}
  T.loading=false;render()};
 document.querySelectorAll('[data-tg],[data-tc]').forEach(b=>b.onclick=()=>{const hc='tc' in b.dataset,hg='tg' in b.dataset;if(hc&&hg){T.cls=b.dataset.tc;T.grp=+b.dataset.tg}else if(hc){T.cls=T.cls===b.dataset.tc?'':b.dataset.tc;T.grp=0}else{T.grp=T.grp===+b.dataset.tg?0:+b.dataset.tg;T.cls=''}render()})}

/* ---------- 라우팅 ---------- */
let route='design';
function render(){
 $('#nav').innerHTML=ROUTES.map(r=>`<button data-go="${r[0]}" ${r[0]===route?'aria-current="page"':''}><small>${r[2]}</small>${r[1]}</button>`).join('');
 let h='';
 if(route==='design')h=CARDS.map((c,i)=>`<section class="slide"><div class="no">${i+1} / ${CARDS.length}</div>${c}</section>`).join('');
 if(route==='charta')h=chartaHTML();
 if(route==='fontes')h=`<section class="slide">${S.fontes}</section><div><button class="btn" data-go="via">다음: 혁명 열차 방탈출</button></div>`;
 if(route==='via')h=viaHTML();
 if(route==='relatio')h=relatioHTML();
 if(route==='concilium')h=conciliumHTML();
 if(route==='teacher')h=teacherHTML();
 $('#app').innerHTML=`<div class="view">${h}</div>`;
 if(route==='via')bindVia();if(route==='relatio')bindRelatio();if(route==='concilium'){if(conTab==='submit')bindSubmit();else bindConcilium()}if(route==='teacher')bindTeacher();
 document.querySelectorAll('[data-save]').forEach(t=>{const k='note-'+t.dataset.save;t.value=store.get(k,'');t.oninput=()=>store.set(k,t.value)});
}
function go(r){if(location.hash!=='#'+r)location.hash=r;else{route=r;render()}window.scrollTo(0,0)}
const lb=$('#lb');lb.onclick=()=>{lb.hidden=true};addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
document.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z){lb.querySelector('img').src=z.dataset.zoom;lb.querySelector('img').alt=z.querySelector('img').alt;lb.hidden=false;lb.focus();return}const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const con=e.target.closest('[data-con]');if(con){conTab=con.dataset.con;render();return}const s=e.target.closest('[data-step]');if(s&&!s.disabled){step=+s.dataset.step;render();window.scrollTo(0,0)}});
function fromHash(){const h=location.hash.slice(1);route=ROUTES.some(r=>r[0]===h)?h:'design';render()}
addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
